services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: omniwatch-backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      HOST: "0.0.0.0"
    # Internal only — browser reaches WS via Nginx /ws on frontend:8080
    # (avoids conflict with local `npm run server` on host port 5000)
    expose:
      - "5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty = browser uses ws(s)://<host>/ws via Nginx proxy
        VITE_WS_URL: ""
    container_name: omniwatch-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  default:
    name: omniwatch-net
